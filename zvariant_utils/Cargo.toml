[package]
name = "zvariant_utils"
version = "3.4.0"
authors = [
    "Zeeshan Ali Khan <zeeshanak@gnome.org>",
    "turbocooler <turbocooler@cocaine.ninja>",
]
edition = "2024"
rust-version = "1.87"

description = "Various utilities used internally by the zvariant crate."
repository = "https://github.com/z-galaxy/zbus/"
keywords = ["D-Bus", "DBus", "IPC", "GVariant"]
license = "MIT"
categories = ["data-structures", "encoding", "parsing"]
readme = "README.md"

[features]
default = []
gvariant = []

[dependencies]
proc-macro2 = "1.0.81"
syn = { version = "2.0.64", features = ["extra-traits", "full"] }
quote = "1.0.36"
serde = { version = "1.0.200", features = ["derive"] }
winnow = "1.0"

[dev-dependencies]
zvariant = { path = "../zvariant", version = "5.12.0", default-features = false }

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]
